version: 0.2

phases:
  install:
    commands:
      - echo Installing Terraform
      - yum install -y unzip
      - curl -LO https://releases.hashicorp.com/terraform/1.13.0/terraform_1.13.0_linux_amd64.zip
      - unzip terraform_1.13.0_linux_amd64.zip
      - mv terraform /usr/local/bin
      - terraform version
  build:
    commands:
      - terraform init
      - terraform validate
      - terraform plan
      - terraform apply -auto-approve
artifacts:
  files:
    - '**/*'
